[workspace]
members = ["."]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[workspace.lints.clippy]
collapsible_if = "allow"
missing_transmute_annotations = "allow"
manual_c_str_literals = "allow"
missing_safety_doc = "allow"
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"

[package]
name = "nany"
version = "0.1.0"
edition = "2024"
authors = ["vsylva"]
license = "MIT"

[lints]
workspace = true

[lib]
name = "nany"
crate-type = ["rlib"]

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = [
    "default_fonts",
] }
min_hook_rs = { version = "=2.2.1", default-features = false }
windows = { version = "=0.58.0", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[build-dependencies]
naga = { version = "=30.0.1", default-features = false, features = [
    "wgsl-in",
    "spv-out",
] }

[[example]]
name = "menu"
path = "examples/menu.rs"
crate-type = ["cdylib"]

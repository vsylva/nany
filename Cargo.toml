[workspace]
members = ["."]
resolver = "2"

[package]
name = "nany"
version = "0.1.0"
edition = "2024"
authors = ["vsylva"]
license = "MIT"

[lib]
name = "nany"
crate-type = ["rlib"]

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = [
    "default_fonts",
] }
naly = { git = "https://github.com/vsylva/naly.git" }
windows = { version = "=0.58.0", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
naga = { version = "=30.0.1", default-features = false, features = [
    "wgsl-in",
    "spv-out",
] }
windows = { version = "=0.58.0", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_System_LibraryLoader",
] }

[[example]]
name = "menu"
path = "examples/menu.rs"
crate-type = ["cdylib"]
